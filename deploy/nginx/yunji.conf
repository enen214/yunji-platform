# New same-origin gateway. Replace domain/certificate paths with allocated resources.
server {
    listen 80;
    server_name yunji.example.invalid;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name yunji.example.invalid;
    ssl_certificate /etc/yunji/tls/fullchain.pem;
    ssl_certificate_key /etc/yunji/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~ ^/(api/local|api/v1/auth/customer/local|v3/api-docs|swagger-ui|actuator)(/|$) { return 404; }
    location ~ ^/(api|auth|system|monitor|captchaImage)(/|$) {
        proxy_pass http://127.0.0.1:18088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control no-store always;
    }
    location = /admin { return 308 /admin/; }
    location /admin/ {
        alias /opt/yunji/current/admin/;
        index index.html;
    }
    location / {
        root /opt/yunji/current/client-h5;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
