name: yunji
services:
  api:
    platform: linux/amd64
    image: yunji-api:${YUNJI_RELEASE:?set YUNJI_RELEASE}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    env_file:
      - ${YUNJI_API_ENV_FILE:?absolute path to api.env}
    environment:
      YUNJI_PROFILE: prod
      YUNJI_BIND_ADDRESS: 0.0.0.0
      YUNJI_API_PORT: "18088"
      YUNJI_STORAGE_ROOT: /var/lib/yunji/files
    volumes:
      - ${YUNJI_FILES_DIR:?absolute persistent files directory}:/var/lib/yunji/files
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 40s
  web:
    platform: linux/amd64
    image: yunji-web:${YUNJI_RELEASE:?set YUNJI_RELEASE}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
    ports:
      - "127.0.0.1:${YUNJI_WEB_PORT:-8080}:80"
    depends_on: [api]
    restart: unless-stopped
