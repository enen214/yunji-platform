# Internal HTTP gateway. Production team terminates TLS in front of this service.
server {
    listen 80;
    server_name _;
    client_max_body_size 12m;
    add_header X-Content-Type-Options nosniff always;
    location ~ ^/(api/local|api/v1/auth/customer/local|v3/api-docs|swagger-ui|actuator)(/|$) { return 404; }
    location ~ ^/(api|auth|system|monitor|captchaImage)(/|$) {
        proxy_pass http://api:18088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        add_header Cache-Control no-store always;
    }
    location = /admin { return 308 /admin/; }
    location /admin/ { root /usr/share/nginx/html; index index.html; }
    location / { root /usr/share/nginx/html/client; try_files $uri $uri/ /index.html; }
}
